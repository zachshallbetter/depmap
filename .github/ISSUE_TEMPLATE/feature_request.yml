name: Feature request
description: Propose a new option, policy rule or viewer capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: >
        Describe the dependency-graph behavior you want and the kind of project you run it on.
  - type: textarea
    id: problem
    attributes:
      label: The behavior you want
      description: What should depmap do? What is the use case?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
      description: A command, an option, an API, or a change to the docs.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
